name: Build and Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check pairing, grouping, move safety, and recovery
        run: swift run BrowserCoreChecks
      - name: Check preview selection and folder navigation
        run: bash scripts/check-preview-store.sh
      - name: Build universal app
        run: PHOTO_BROWSER_UNIVERSAL=1 bash scripts/build-app.sh
      - name: Check both languages and packaged resources
        run: bash scripts/check-localization.sh 'dist/照片浏览器.app'
      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict 'dist/照片浏览器.app'
          lipo -verify_arch arm64 x86_64 'dist/照片浏览器.app/Contents/MacOS/PhotoBrowser'
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/照片浏览器.app' dist/PhotoBrowser-macos-universal.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PhotoBrowser-macos-universal
          path: dist/PhotoBrowser-macos-universal.zip
          if-no-files-found: error
